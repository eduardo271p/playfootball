<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Prisma 10</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..900&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: cabeçalho fixo, páginas por hash (início, jogadores, ficha, Bola de Ouro, comparar). Grade de 12 colunas simples, cartões só onde há objeto clicável. */
:root{
  --bg:#F2F5F2; --surface:#FFFFFF; --surface-2:#E8EEE9; --ink:#0E1B15; --ink-2:#4B5C53; --ink-3:#7A8A81;
  --line:#D5DDD7; --accent:#0A6B49; --accent-ink:#FFFFFF; --accent-soft:#D9EEE3;
  --gold:#A87810; --gold-soft:#F5E9C8; --a:#2D5BE3; --b:#D9501F;
  --pitch:#0A2A1F; --pitch-2:#0F3A2B; --on-pitch:#EAF4EE; --on-pitch-2:#9CBBAA;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif; --f-body:"Instrument Sans","Segoe UI",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --shadow:0 1px 2px rgba(10,30,20,.06),0 6px 20px rgba(10,30,20,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A130F; --surface:#111D17; --surface-2:#192922; --ink:#E7EFEA; --ink-2:#9EB0A6; --ink-3:#6E8176;
  --line:#25362D; --accent:#34C88E; --accent-ink:#04150D; --accent-soft:#123826;
  --gold:#E2B64B; --gold-soft:#3A2F10; --a:#7F9DFF; --b:#FF8A5E;
  --pitch:#0C2A1F; --pitch-2:#12392A; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A130F; --surface:#111D17; --surface-2:#192922; --ink:#E7EFEA; --ink-2:#9EB0A6; --ink-3:#6E8176;
  --line:#25362D; --accent:#34C88E; --accent-ink:#04150D; --accent-soft:#123826;
  --gold:#E2B64B; --gold-soft:#3A2F10; --a:#7F9DFF; --b:#FF8A5E;
  --pitch:#0C2A1F; --pitch-2:#12392A; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
a{color:inherit;text-decoration:none}
button,select,input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-stretch:82%;font-weight:800;line-height:1.02;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}

/* Cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:60px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:23px;letter-spacing:-.01em}
.brand svg{color:var(--ink)}
.nav{display:flex;gap:4px;margin-left:12px;flex-wrap:wrap}
.nav a{padding:8px 13px;border-radius:6px;font-weight:600;font-size:14px;color:var(--ink-2)}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{color:var(--accent-ink);background:var(--accent)}
.tools{margin-left:auto;display:flex;gap:8px}
.ibtn{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center}
.ibtn:hover{background:var(--surface-2)}

/* Botões e campos */
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;font-size:14.5px}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.field{height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);width:100%}
select.field{padding-right:10px}
.search{position:relative;display:flex;gap:8px;max-width:520px}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:15;overflow:hidden}
.sugg a{display:flex;align-items:center;gap:10px;padding:10px 12px}
.sugg a:hover,.sugg a:focus-visible{background:var(--surface-2)}
.sugg small{color:var(--ink-2);margin-left:auto}

/* Monograma e nota */
.mg{--h:150;width:var(--s,44px);height:var(--s,44px);flex:none;border-radius:10px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-stretch:85%;font-weight:800;font-size:calc(var(--s,44px)*.38);background:linear-gradient(150deg,hsl(var(--h) 48% 34%),hsl(var(--h) 55% 20%));letter-spacing:.02em}
.cc{font-family:var(--f-mono);font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--ink-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.nota{font-family:var(--f-mono);font-weight:700;font-size:15px;min-width:38px;text-align:center;padding:4px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.ring{--v:90;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--v)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.ring b{width:76px;height:76px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-stretch:80%;font-size:34px;font-weight:800}

/* Hero */
.hero{padding-block:56px 40px;display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(40px,6.4vw,76px);margin-block:14px 18px}
.hero .lead{max-width:50ch;color:var(--ink-2);font-size:17px;margin-bottom:26px}
.hero .cta{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
.feat{background:var(--pitch);color:var(--on-pitch);border-radius:14px;padding:26px;position:relative;overflow:hidden;min-height:330px;display:flex;flex-direction:column;justify-content:space-between;gap:22px}
.feat::before{content:"";position:absolute;right:-110px;top:50%;width:330px;height:330px;margin-top:-165px;border:2px solid rgba(255,255,255,.09);border-radius:50%}
.feat::after{content:"";position:absolute;right:54px;top:0;bottom:0;border-right:2px solid rgba(255,255,255,.09)}
.feat>*{position:relative;z-index:1}
.feat .eyebrow{color:var(--on-pitch-2)}
.feat h2{font-size:clamp(34px,4.4vw,52px);margin-top:10px}
.feat .sub{display:flex;gap:8px;align-items:center;margin-top:10px;color:var(--on-pitch-2)}
.feat .cc{color:var(--on-pitch);border-color:rgba(255,255,255,.25)}
.feat dl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0;max-width:340px}
.feat dt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--on-pitch-2)}
.feat dd{margin:2px 0 0;font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:34px;line-height:1}
.feat .go{align-self:flex-start;font-weight:600;font-size:14px;border-bottom:1px solid rgba(255,255,255,.4);padding-bottom:2px}

.strip{display:grid;grid-template-columns:repeat(3,1fr);border-block:1px solid var(--line);background:var(--surface)}
.strip>div{padding:22px 20px;display:flex;flex-direction:column;gap:2px}
.strip>div+div{border-left:1px solid var(--line)}
.strip b{font-family:var(--f-display);font-stretch:80%;font-size:42px;font-weight:800;line-height:1}
.strip span{color:var(--ink-2);font-size:13.5px}

/* Seções */
.sec{padding-block:48px 8px}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.sec-h h2{font-size:clamp(28px,3.6vw,40px)}
.sec-h p{color:var(--ink-2);max-width:56ch;margin-top:8px}
.link{font-weight:600;color:var(--accent);border-bottom:1px solid currentColor;padding-bottom:1px}

/* Cartão de jogador */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:14px}
.pcard{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;transition:transform .15s,box-shadow .15s,border-color .15s;min-width:0}
.pcard:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--accent)}
.pc-top{display:flex;align-items:center;gap:12px;justify-content:space-between}
.pc-name{font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:20px;line-height:1.1;overflow-wrap:anywhere}
.pc-sub{display:flex;gap:7px;align-items:center;color:var(--ink-2);font-size:13px;margin-top:6px;flex-wrap:wrap}
.pc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0;padding-top:12px;border-top:1px solid var(--line)}
.pc-stats dt{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.pc-stats dd{margin:1px 0 0;font-family:var(--f-mono);font-weight:700;font-size:15px}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:4px;padding:2px 6px;background:var(--gold-soft);color:var(--gold)}

/* Tabela de ranking */
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tr{display:grid;grid-template-columns:36px minmax(0,1.6fr) minmax(0,1fr) minmax(0,1.3fr) 70px 52px;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.tr:first-child{border-top:0}
.tr.th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2);padding-block:9px}
a.tr:hover{background:var(--surface-2)}
.tr .who{display:flex;gap:11px;align-items:center;min-width:0}
.tr .who b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .who small{color:var(--ink-2)}
.rk{font-family:var(--f-mono);color:var(--ink-3);font-weight:700}
.meter{display:flex;align-items:center;gap:10px}
.track{flex:1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;min-width:40px}
.fill{height:100%;background:var(--accent);border-radius:4px}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;align-items:start}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
a.li:hover{background:var(--surface-2)}
.li .rk{width:22px}
.li .nm{flex:1;min-width:0}
.li .nm b{display:block;font-weight:600}
.li .nm small{color:var(--ink-2)}
.duel{margin-block:48px 56px;background:var(--pitch);color:var(--on-pitch);border-radius:14px;padding:30px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.duel h2{font-size:clamp(28px,3.6vw,40px)}
.duel p{color:var(--on-pitch-2);margin-top:8px;max-width:48ch}

/* Jogadores */
.pg-h{padding-block:40px 18px}
.pg-h h1{font-size:clamp(34px,5vw,56px);margin-top:10px}
.pg-h p{color:var(--ink-2);margin-top:12px;max-width:60ch}
.filters{display:grid;grid-template-columns:minmax(200px,1.4fr) repeat(2,minmax(150px,.7fr)) auto;gap:10px;align-items:center;margin-bottom:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.count{color:var(--ink-2);font-size:13.5px;margin-bottom:14px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;color:var(--ink-2)}

/* Ficha */
.crumb{padding-block:26px 6px;font-size:13.5px;color:var(--ink-2)}
.crumb a:hover{color:var(--accent)}
.fh{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;padding-block:14px 26px}
.fh h1{font-size:clamp(34px,5vw,60px)}
.fh .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px;color:var(--ink-2)}
.fh .acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:22px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.tile small{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.tile b{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:36px;line-height:1.1}
.tile em{font-style:normal;color:var(--ink-3);font-size:12px;display:block}
.cols{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px}
.panel h3{font-size:24px;margin-bottom:14px}
.panel .txt{color:var(--ink-2);margin-bottom:18px}
.mrow{display:grid;grid-template-columns:128px 1fr 60px;gap:12px;align-items:center;padding-block:8px}
.mrow span{font-size:13.5px;color:var(--ink-2)}
.mrow .pct{font-size:11.5px;color:var(--ink-3);text-align:right}
.mrow .v{font-family:var(--f-mono);font-weight:700;text-align:right}
.pctline{position:relative;height:10px;border-radius:5px;background:var(--surface-2)}
.pctline i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--accent)}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl li{position:relative;padding:0 0 16px 28px}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:"";position:absolute;left:0;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl b{display:block;font-weight:600}
.tl span{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;margin:0}
.dl dt{color:var(--ink-2);font-size:13.5px}
.dl dd{margin:0;font-weight:600;text-align:right}
.stack{display:flex;flex-direction:column;gap:20px}

/* Bola de Ouro */
.gold{color:var(--gold)}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:8px}
.big .tile b{font-size:44px}
.hist .tr{grid-template-columns:64px minmax(0,1.5fr) minmax(0,1.2fr) 60px}
.hist .win{display:flex;gap:11px;align-items:center;min-width:0}
.hist .yr{font-family:var(--f-mono);font-weight:700}
.hist .none{color:var(--ink-3);font-style:italic}

/* Comparador */
.pick{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:end;margin-bottom:22px}
.pick label{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;font-weight:700}
.pick .la{color:var(--a)} .pick .lb{color:var(--b)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.side{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:12px;padding:18px;display:flex;gap:14px;align-items:center;min-width:0}
.side.a{--c:var(--a)} .side.b{--c:var(--b)}
.side h3{font-size:26px;overflow-wrap:anywhere}
.side small{color:var(--ink-2);display:block;margin-top:4px}
.cmp{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 18px}
.crow{padding-block:14px;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.crow .lb{text-align:center;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:700;margin-bottom:8px}
.crow .cells{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cell{min-width:0}
.cell.a{text-align:right} .cell.b{text-align:left}
.cell .v{font-family:var(--f-mono);font-size:22px;font-weight:500;color:var(--ink-2)}
.cell.w .v{font-weight:700;color:var(--ink)}
.cell .bar{height:8px;border-radius:4px;background:var(--surface-2);margin-top:6px;display:flex}
.cell.a .bar{justify-content:flex-end}
.cell .bar i{display:block;height:100%;border-radius:4px;background:var(--c);opacity:.45}
.cell.w .bar i{opacity:1}
.cell.a{--c:var(--a)} .cell.b{--c:var(--b)}
.cell small{display:block;font-size:11px;color:var(--ink-3);margin-top:3px}
.note{background:var(--gold-soft);color:var(--ink);border-radius:8px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.cmpcar{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}

footer{margin-top:64px;border-top:1px solid var(--line);background:var(--surface)}
footer .wrap{padding-block:26px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--ink-2);font-size:13.5px}
footer b{color:var(--ink);font-family:var(--f-display);font-stretch:80%;font-size:18px}

@media (max-width:900px){
  .hero{grid-template-columns:1fr;padding-block:36px 28px}
  .two,.cols{grid-template-columns:1fr}
  .filters{grid-template-columns:1fr 1fr}
  .filters .field:first-child{grid-column:1/-1}
  .tr{grid-template-columns:30px minmax(0,1fr) 70px 46px}
  .tr .lg,.tr.th .lg,.tr .ast{display:none}
  .hist .tr{grid-template-columns:54px minmax(0,1fr) 54px}
  .hist .tr .clb{display:none}
}
@media (max-width:620px){
  .top .wrap{gap:6px 10px}
  .nav{order:3;width:100%;margin-left:-6px}
  .tools{margin-left:auto}
  .fh{grid-template-columns:auto 1fr}
  .fh .ring{grid-column:1/-1;justify-self:start}
  .pick{grid-template-columns:1fr}
  .pick .ibtn{justify-self:center}
  .vs,.cmpcar{grid-template-columns:1fr}
  .strip{grid-template-columns:1fr}
  .strip>div+div{border-left:0;border-top:1px solid var(--line)}
  .mrow{grid-template-columns:100px 1fr 52px}
  .side{padding:14px}
  .side h3{font-size:22px}
  .cell .v{font-size:19px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<header class="top">
  <div class="wrap">

  const q=norm(S.q);
  let r=PL.filter(p=>(S.leg||!p.leg)&&(S.pos==="Todos"||p.pos===S.pos)&&(S.liga==="Todas"||p.liga===S.liga)&&(!q||norm(p.nome).includes(q)||norm(p.clube).includes(q)||norm(p.pais).includes(q)));
  const k={nota:(a,b)=>b.nota-a.nota,gols:(a,b)=>b.g-a.g||b.nota-a.nota,assist:(a,b)=>(b.a??-1)-(a.a??-1)||b.nota-a.nota,nome:(a,b)=>a.nome.localeCompare(b.nome,"pt")};
  return r.sort(k[S.ord]);
}
function jogadores(){
  app.innerHTML=`<section class="wrap pg-h"><div class="eyebrow">Catálogo · ${PL.length} perfis</div><h1>Jogadores</h1><p>Filtre por posição e liga, ordene pelo que importa e abra a ficha completa de cada perfil.</p></section>
  <section class="wrap">
    <div class="filters">
      <input class="field" id="fq" type="search" placeholder="Buscar por nome, clube ou país" aria-label="Buscar jogador" value="${S.q.replace(/"/g,"&quot;")}">
      <select class="field" id="fl" aria-label="Liga"><option>Todas</option>${LIGAS.map(l=>`<option ${l===S.liga?"selected":""}>${l}</option>`).join("")}</select>
      <select class="field" id="fo" aria-label="Ordenar por">${[["nota","Maior nota"],["gols","Mais gols"],["assist","Mais assistências"],["nome","Nome (A–Z)"]].map(([v,t])=>`<option value="${v}" ${v===S.ord?"selected":""}>${t}</option>`).join("")}</select>
      <label class="chk"><input type="checkbox" id="fg" ${S.leg?"checked":""}> Incluir lendas</label>
    </div>
    <div class="chips" id="chips">${["Todos",...POS].map(p=>`<button type="button" class="chip" data-pos="${p}" aria-pressed="${p===S.pos}">${p}</button>`).join("")}</div>
    <div class="count" id="ct" aria-live="polite"></div>
    <div id="gr"></div>
  </section>`;
  const draw=()=>{const r=filtrar();document.getElementById("ct").textContent=`${r.length} ${r.length===1?"jogador":"jogadores"}`;
    document.getElementById("gr").innerHTML=r.length?`<div class="grid">${r.map(card).join("")}</div>`:`<div class="empty">Nenhum jogador com esses filtros. Remova um filtro ou mude a busca.</div>`;
    document.querySelectorAll("#chips .chip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.pos===S.pos))};
  document.getElementById("fq").addEventListener("input",e=>{S.q=e.target.value;draw()});
  document.getElementById("fl").addEventListener("change",e=>{S.liga=e.target.value;draw()});
  document.getElementById("fo").addEventListener("change",e=>{S.ord=e.target.value;draw()});
  document.getElementById("fg").addEventListener("change",e=>{S.leg=e.target.checked;draw()});
  document.getElementById("chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(b){S.pos=b.dataset.pos;draw()}});
  draw();
}

function pctOf(fn,v){return Math.round(ACT.filter(p=>fn(p)<=v).length/ACT.length*100)}
function ficha(id){
  const p=BY[id];
  if(!p){app.innerHTML=`<section class="wrap pg-h"><h1>Jogador não encontrado</h1><p>Esse perfil não existe no catálogo.</p><p style="margin-top:16px"><a class="btn pri" href="#jogadores">Ver todos os jogadores</a></p></section>`;return}
  const gk=p.pos==="Goleiro";
  const tiles=[];
  if(gk){ tiles.push(["Sem sofrer gol",n0(p.cs),p.leg?"carreira (aprox.)":"na temporada"]); if(!p.leg){tiles.push(["Jogos",n0(p.j),""],["Minutos",n0(p.m),""])} }
  else{ tiles.push([p.leg?"Gols":"Gols",n0(p.g),p.leg?"carreira":"temporada"]); if(!p.leg){tiles.push(["Assist.",n0(p.a),"temporada"],["Jogos",n0(p.j),""],["Minutos",n0(p.m),""])} }
  tiles.push(["Nota",p.nota,"0 a 100"]);
  const out=[["Gols por 90",gp90(p),gp90],["Assist. por 90",ap90(p),ap90],["Gols + assist. por 90",gap90(p),gap90]];
  const perfil=(!p.leg&&!gk)?out.map(([l,v,fn])=>{const pc=pctOf(fn,v);const mx=Math.max(...ACT.map(fn));return `<div class="mrow"><span>${l}</span><div class="pctline" title="Percentil ${pc} entre jogadores de linha"><i style="width:${Math.max(4,v/mx*100)}%"></i></div><span class="v">${n2(v)}</span><span></span><span class="pct" style="grid-column:2/4;text-align:left">Percentil ${pc} entre jogadores de linha do catálogo</span></div>`}).join(""):
    gk&&!p.leg?`<div class="mrow"><span>Sem sofrer gol</span><div class="pctline"><i style="width:${p.cs/p.j*100}%"></i></div><span class="v">${Math.round(p.cs/p.j*100)}%</span></div><div class="pct" style="color:var(--ink-3);font-size:12px">${p.cs} jogos sem sofrer gol em ${p.j} partidas.</div>`:
    `<p class="txt" style="margin:0">Os números de lendas são totais de carreira e não entram nos comparativos por 90 minutos.</p>`;
  const sim=PL.filter(x=>x.id!==p.id&&x.pos===p.pos&&x.leg===p.leg).sort((a,b)=>Math.abs(a.nota-p.nota)-Math.abs(b.nota-p.nota)||b.nota-a.nota).slice(0,3);
  app.innerHTML=`
  <div class="wrap crumb"><a href="#jogadores">Jogadores</a> / ${p.nome}</div>
  <section class="wrap fh">
    ${mg(p,92)}
    <div>
      <h1>${p.nome}</h1>
      <div class="meta"><span class="cc">${p.pais}</span><span>${PAISES[p.pais][0]}</span><span>·</span><span>${p.clube}</span><span>·</span><span>${p.pos}</span>${p.leg?'<span class="tag">Lenda</span>':`<span>·</span><span>${p.liga}</span>`}</div>
      <div class="acts"><a class="btn pri" href="#comparar" data-cmp="${p.id}">Comparar com outro jogador</a><a class="btn" href="#jogadores">Voltar ao catálogo</a></div>
    </div>
    <div class="ring" style="--v:${p.nota}" title="Nota ${p.nota} de 100"><b>${p.nota}</b></div>
  </section>
  <section class="wrap">
    <div class="tiles">${tiles.map(([k,v,s])=>`<div class="tile"><small>${k}</small><b>${v}</b><em>${s||"&nbsp;"}</em></div>`).join("")}</div>
    <div class="cols">
      <div class="stack">
        <div class="panel"><h3>Perfil de jogo</h3><p class="txt">${p.perfil}</p>${perfil}</div>
        <div class="panel"><h3>Histórico de carreira</h3><ul class="tl">${p.car.map(([c,y])=>`<li><b>${c}</b><span>${y}</span></li>`).join("")}</ul></div>
      </div>
      <div class="stack">
        <div class="panel"><h3>Ficha técnica</h3><dl class="dl">
          <dt>País</dt><dd>${PAISES[p.pais][0]}</dd><dt>Clube</dt><dd>${p.clube}</dd><dt>Posição</dt><dd>${p.pos}</dd>
          ${p.leg?`<dt>Nascimento</dt><dd>${p.nasc}</dd>`:`<dt>Liga</dt><dd>${p.liga}</dd><dt>Idade (2024/25)</dt><dd>${idade(p)} anos</dd>`}
          <dt>Altura</dt><dd>${p.alt} cm</dd></dl></div>
        <div class="panel"><h3>Perfis parecidos</h3><div class="list" style="border:0;border-radius:0">${sim.map(x=>`<a class="li" href="#jogador-${x.id}" style="padding-inline:0">${mg(x,36)}<span class="nm"><b>${x.nome}</b><small>${x.clube}</small></span><span class="nota">${x.nota}</span></a>`).join("")}</div></div>
      </div>
    </div>
  </section>`;
}

const WIN=[
[2025,"Ousmane Dembélé","FRA","PSG","ousmane-dembele"],[2024,"Rodri","ESP","Manchester City","rodri"],[2023,"Lionel Messi","ARG","PSG","lionel-messi"],[2022,"Karim Benzema","FRA","Real Madrid"],[2021,"Lionel Messi","ARG","Barcelona","lionel-messi"],[2020,null],[2019,"Lionel Messi","ARG","Barcelona","lionel-messi"],[2018,"Luka Modrić","CRO","Real Madrid","luka-modric"],[2017,"Cristiano Ronaldo","POR","Real Madrid","cristiano-ronaldo"],[2016,"Cristiano Ronaldo","POR","Real Madrid","cristiano-ronaldo"],[2015,"Lionel Messi","ARG","Barcelona","lionel-messi"],[2014,"Cristiano Ronaldo","POR","Real Madrid","cristiano-ronaldo"],[2013,"Cristiano Ronaldo","POR","Real Madrid","cristiano-ronaldo"],[2012,"Lionel Messi","ARG","Barcelona","lionel-messi"],[2011,"Lionel Messi","ARG","Barcelona","lionel-messi"],[2010,"Lionel Messi","ARG","Barcelona","lionel-messi"],[2009,"Lionel Messi","ARG","Barcelona","lionel-messi"],[2008,"Cristiano Ronaldo","POR","Manchester United","cristiano-ronaldo"],[2007,"Kaká","BRA","Milan"],[2006,"Fabio Cannavaro","ITA","Real Madrid"],[2005,"Ronaldinho","BRA","Barcelona"],[2004,"Andriy Shevchenko","UKR","Milan"],[2003,"Pavel Nedvěd","CZE","Juventus"],[2002,"Ronaldo Nazário","BRA","Real Madrid"],[2001,"Michael Owen","ENG","Liverpool"],[2000,"Luís Figo","POR","Real Madrid"]
];
function bola(){
  const inCat=PL.filter(p=>WIN.some(w=>w[4]===p.id));
  const cand=[...ACT].sort((a,b)=>b.nota-a.nota||b.g-a.g).slice(0,6);
  app.innerHTML=`<section class="wrap pg-h"><div class="eyebrow gold">Prêmio da France Football</div><h1>Bola de Ouro</h1><p>Os vencedores desde 2000, os maiores campeões da história e quem do catálogo já levou o troféu.</p></section>
  <section class="wrap">
    <div class="big">
      <div class="tile"><small>Lionel Messi</small><b class="gold">8</b><em>Bolas de Ouro</em></div>
      <div class="tile"><small>Cristiano Ronaldo</small><b class="gold">5</b><em>Bolas de Ouro</em></div>
      <div class="tile"><small>Platini, Cruyff, Van Basten</small><b class="gold">3</b><em>cada um</em></div>
      <div class="tile"><small>Ronaldo Nazário</small><b class="gold">2</b><em>1997 e 2002</em></div>
    </div>
  </section>
  <section class="wrap sec">
    <div class="two">
      <div>
        <div class="sec-h"><div><h2>Vencedores desde 2000</h2><p>Clube na temporada premiada. Em 2020 o prêmio não foi entregue.</p></div></div>
        <div class="tbl hist">
          <div class="tr th"><span>Ano</span><span>Vencedor</span><span class="clb">Clube</span><span>País</span></div>
          ${WIN.map(w=>w[1]?`<div class="tr"><span class="yr">${w[0]}</span><span class="win">${w[4]?mg(BY[w[4]],34):`<span class="mg" style="--s:34px;--h:${PAISES[w[2]][1]}">${w[1].split(" ").map(x=>x[0]).slice(0,2).join("")}</span>`}<b style="font-weight:600;min-width:0">${w[4]?`<a href="#jogador-${w[4]}" style="border-bottom:1px solid var(--line)">${w[1]}</a>`:w[1]}</b></span><span class="clb">${w[3]}</span><span class="cc" style="justify-self:start">${w[2]}</span></div>`
            :`<div class="tr"><span class="yr">${w[0]}</span><span class="none" style="grid-column:2/-1">Prêmio não entregue por causa da pandemia.</span></div>`).join("")}
        </div>
      </div>
      <div class="stack">
        <div><div class="sec-h"><div><h2>No catálogo</h2><p>Campeões que têm ficha aqui.</p></div></div>
          <div class="list">${inCat.map(p=>{const y=WIN.filter(w=>w[4]===p.id).map(w=>w[0]).sort();return `<a class="li" href="#jogador-${p.id}">${mg(p,36)}<span class="nm"><b>${p.nome}</b><small>${y.length} ${y.length>1?"vezes":"vez"} · ${y.join(", ")}</small></span><span class="nota">${p.nota}</span></a>`}).join("")}</div></div>
        <div><div class="sec-h"><div><h2>Candidatos pela nota</h2><p>Maiores notas entre os jogadores atuais.</p></div></div>
          <div class="list">${cand.map((p,i)=>`<a class="li" href="#jogador-${p.id}"><span class="rk">${i+1}</span>${mg(p,36)}<span class="nm"><b>${p.nome}</b><small>${p.clube}</small></span><span class="nota">${p.nota}</span></a>`).join("")}</div></div>
      </div>
    </div>
  </section>`;
}

function opts(sel){return POS.map(g=>`<optgroup label="${g}s">${PL.filter(p=>p.pos===g).sort((a,b)=>a.nome.localeCompare(b.nome,"pt")).map(p=>`<option value="${p.id}" ${p.id===sel?"selected":""}>${p.nome} (${p.clube})</option>`).join("")}</optgroup>`).join("")}
function comparar(){
  app.innerHTML=`<section class="wrap pg-h"><div class="eyebrow">Duelo de fichas</div><h1>Comparar jogadores</h1><p>Escolha dois jogadores e veja os números lado a lado. A barra mais forte marca quem leva a melhor em cada linha.</p></section>
  <section class="wrap">
    <div class="pick">
      <div><label class="la" for="sa">Jogador A</label><select class="field" id="sa">${opts(S.a)}</select></div>
      <button class="ibtn" id="sw" type="button" aria-label="Trocar jogadores" title="Trocar jogadores"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg></button>
      <div><label class="lb" for="sb">Jogador B</label><select class="field" id="sb">${opts(S.b)}</select></div>
    </div>
    <div id="cr"></div>
  </section>`;
  const draw=()=>{
    const A=BY[S.a],B=BY[S.b];
    const mix=(A.leg||B.leg);
    const rows=[
      ["Nota",p=>p.nota,n0,1],
      ["Gols",p=>p.g,n0,1,p=>p.leg?"carreira":""],
      ["Assistências",p=>p.a,n0,1,p=>p.leg?"carreira":""],
      ["Jogos",p=>p.j,n0,1],["Minutos",p=>p.m,n0,1],
      ["Gols por 90",gp90,n2,1],["Assist. por 90",ap90,n2,1],["Gols + assist. por 90",gap90,n2,1],
      ...((A.pos==="Goleiro"||B.pos==="Goleiro")?[["Jogos sem sofrer gol",p=>p.pos==="Goleiro"?p.cs:null,n0,1]]:[]),
      ["Idade (2024/25)",p=>idade(p),n0,0],["Altura (cm)",p=>p.alt,n0,0]
    ];
    const cell=(p,v,f,w,mx,sub,c)=>`<div class="cell ${c}${w?" w":""}"><div class="v">${f(v)}</div><div class="bar"><i style="width:${v==null||!mx?0:Math.max(2,v/mx*100)}%"></i></div>${sub?`<small>${sub}</small>`:""}</div>`;
    document.getElementById("cr").innerHTML=`
    <div class="vs">${[[A,"a"],[B,"b"]].map(([p,c])=>`<a class="side ${c}" href="#jogador-${p.id}">${mg(p,56)}<div style="min-width:0"><h3>${p.nome}</h3><small>${p.clube} · ${p.pos}</small></div></a>`).join("")}</div>
    ${mix?`<div class="note">Estatísticas de lendas são totais de carreira. Linhas por 90 minutos, jogos e minutos aparecem em branco quando não há dado comparável.</div>`:""}
    <div class="cmp">${rows.map(([l,fn,f,win,sub])=>{const va=fn(A),vb=fn(B),mx=Math.max(va??0,vb??0);
      const ok=win&&va!=null&&vb!=null&&va!==vb;const wa=ok&&va>vb,wb=ok&&vb>va;
      return `<div class="crow"><div class="lb">${l}</div><div class="cells">${cell(A,va,f,wa,mx,sub?sub(A):"","a")}${cell(B,vb,f,wb,mx,sub?sub(B):"","b")}</div></div>`}).join("")}</div>
    <div class="cmpcar">${[A,B].map(p=>`<div class="panel"><h3>${p.nome}</h3><ul class="tl">${p.car.map(([c,y])=>`<li><b>${c}</b><span>${y}</span></li>`).join("")}</ul></div>`).join("")}</div>`;
  };
  document.getElementById("sa").addEventListener("change",e=>{S.a=e.target.value;draw()});
  document.getElementById("sb").addEventListener("change",e=>{S.b=e.target.value;draw()});
  document.getElementById("sw").addEventListener("click",()=>{[S.a,S.b]=[S.b,S.a];document.getElementById("sa").value=S.a;document.getElementById("sb").value=S.b;draw()});
  draw();
}

/* ---------- Roteador ---------- */
function route(){
  const h=location.hash.slice(1)||"inicio";
  document.querySelectorAll("#nav a").forEach(a=>{const r=a.dataset.r;const on=h===r||(r==="jogadores"&&h.startsWith("jogador-"));on?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current")});
  if(h==="inicio")home();else if(h==="jogadores")jogadores();else if(h==="bola-de-ouro")bola();else if(h==="comparar")comparar();else if(h.startsWith("jogador-"))ficha(h.slice(8));else home();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
document.addEventListener("click",e=>{
  const c=e.target.closest("[data-cmp]");
  if(c){const id=c.dataset.cmp;S.a=id;if(S.b===id){const alt=PL.filter(p=>p.id!==id&&p.pos===BY[id].pos).sort((x,y)=>y.nota-x.nota)[0]||PL.find(p=>p.id!==id);S.b=alt.id}}
  const s=e.target.closest("[data-set]");
  if(s){const [a,b]=s.dataset.set.split(",");S.a=a;S.b=b}
  if(!e.target.closest(".search")){const sg=document.getElementById("sg");if(sg)sg.hidden=true}
});
/* Tema */
const root=document.documentElement;
try{const t=localStorage.getItem("p10-theme");if(t)root.setAttribute("data-theme",t)}catch(e){}
document.getElementById("theme").addEventListener("click",()=>{
  const cur=root.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  const nx=cur==="dark"?"light":"dark";root.setAttribute("data-theme",nx);
  try{localStorage.setItem("p10-theme",nx)}catch(e){}
});
route();
</script>
